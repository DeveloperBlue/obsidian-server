services:
  
  couchdb:
    image: couchdb:3.3
    container_name: obsidian_couchdb
    environment:
      - COUCHDB_USER=${COUCH_USER}
      - COUCHDB_PASSWORD=${COUCH_PASSWORD}
    ports:
      - "${COUCHDB_PORT}:5984"
    volumes:
      - ${ROOT_DIR}/couchdb/data:/opt/couchdb/data
      - ./obsidian.ini:/opt/couchdb/etc/local.d/obsidian.ini
    restart: unless-stopped

  obsidian-web:
    image: nobbe/ignis:latest
    container_name: obsidian_web
    ports:
      - "${WEB_BROWSER_PORT}:8080"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${ROOT_DIR}/web-vaults:/vaults
      - ${ROOT_DIR}/web-data:/app/data
      - ${ROOT_DIR}/obsidian-app:/app/obsidian-app
    restart: unless-stopped