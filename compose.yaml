version: '3.8'

services:
  couchdb:
    image: couchdb:3.3
    container_name: obsidian_couchdb
    environment:
      - COUCHDB_USER=${COUCH_USER}
      - COUCHDB_PASSWORD=${COUCH_PASSWORD}
    ports:
      - "${COUCHDB_PORT}:5984"
    volumes:
      - ./data:/opt/couchdb/data
    restart: unless-stopped

  obsidian-web:
    image: nobbe/ignis:latest
    container_name: obsidian_web
    ports:
      - "${WEB_BROWSER_PORT}:8080"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ./web-vaults:/vaults
      - ./web-data:/app/data
      - obsidian-app:/app/obsidian-app
    restart: unless-stopped

volumes:
  obsidian-app:
